# Build APK Rayva otomatis di GitHub (tanpa perlu install Flutter di laptop).
# Jalan setiap kali ada push ke branch main/master, atau manual lewat tab "Actions" > "Run workflow".
name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write # dibutuhkan untuk membuat Release berisi APK

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Membuat file platform Android yang belum ada (Gradle, MainActivity, ikon).
      # File yang sudah ada (mis. AndroidManifest.xml) TIDAK ditimpa.
      - name: Generate Android project files
        run: flutter create --org com.rayva --project-name rayva --platforms android .

      - run: flutter pub get

      - name: Run tests
        run: flutter test
        continue-on-error: true

      - name: Build release APK
        run: flutter build apk --release --build-number ${{ github.run_number }}

      - name: Rename APK
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          mv build/app/outputs/flutter-apk/app-release.apk "rayva-v${VERSION}-build${{ github.run_number }}.apk"
          echo "APK_FILE=rayva-v${VERSION}-build${{ github.run_number }}.apk" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rayva-apk
          path: ${{ env.APK_FILE }}

      # Memakai GitHub CLI (sudah terpasang di runner) agar pesan error-nya jelas.
      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" "$APK_FILE" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Rayva build ${{ github.run_number }}" \
            --notes 'Unduh file .apk di bawah ini dari HP, lalu buka untuk meng-install. (Izinkan "Instal dari sumber tidak dikenal" jika diminta.)'

